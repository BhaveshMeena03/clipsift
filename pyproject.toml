[project]
name = "clipsift"
version = "0.1.0"
description = "Find highlight moments in long gaming recordings and export 9:16 clips, all locally."
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.0",
    "onnxruntime==1.32.0",
    "av==18.1.0",
    "numpy==2.4.6",
    "pillow==13.0.0",
    "rapidocr-onnxruntime==1.4.4",
    "sherpa-onnx==2.0.1",
    "rapidfuzz==3.14.6",
    "fastapi==0.163.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
    "yt-dlp==2026.10.26",
    "yt-dlp-ejs==0.8.0",
    "psutil==7.2.2",
    "huggingface-hub==2.4.0",
    "nvidia-cublas-cu12==12.9.1.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff==0.17.5"]

[project.scripts]
clipsift = "clipsift.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipsift*"]

[tool.setuptools.package-data]
clipsift = ["assets/fonts/*", "web/*", "web/**/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "media: needs ffmpeg and real media files",
    "models: needs downloaded speech / tagger models",
    "slow: takes more than a few seconds",
]
